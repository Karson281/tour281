<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>全球旅行顧問 - 智能行程搜尋與評分系統</title>
    <!-- 引入 Tailwind CSS 打造現代化 UI -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">

    <!-- 頂部導覽列 -->
    <header class="bg-indigo-600 text-white shadow-lg">
        <div class="max-w-5xl mx-auto px-4 py-6">
            <h1 class="text-2xl font-bold flex items-center gap-3">
                <i class="fa-solid font-bold fa-plane-departure"></i> 全球旅行顧問 - 智能行程搜尋器
            </h1>
            <p class="text-indigo-100 text-sm mt-1">即時整合香港與內地平民高性價比行程，全包制價格（含導遊費）與五維智能評分</p>
        </div>
    </header>

    <main class="max-w-5xl mx-auto px-4 py-8 grid grid-cols-1 md:grid-cols-3 gap-8">
        
        <!-- 左側：輸入表單 (第一步) -->
        <section class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 md:col-span-1 h-fit">
            <h2 class="text-lg font-bold text-slate-900 border-b pb-3 mb-4 flex items-center gap-2">
                <i class="fa-solid fa-sliders text-indigo-600"></i> 第一步：篩選條件
            </h2>

            <!-- 快捷編碼輸入框 -->
            <div class="mb-5 bg-indigo-50 p-3 rounded-xl border border-indigo-100">
                <label class="block text-xs font-semibold text-indigo-900 mb-1">快捷編碼輸入 (例如: AAAD9+BC)</label>
                <div class="flex gap-2">
                    <input type="text" id="quickCode" placeholder="AAAD9+BC" class="w-full text-sm border-slate-300 rounded-lg p-2 focus:ring-2 focus:ring-indigo-500 uppercase">
                    <button onclick="applyQuickCode()" class="bg-indigo-600 text-white px-3 py-2 rounded-lg text-xs font-bold hover:bg-indigo-700">套用</button>
                </div>
            </div>

            <form id="searchForm" class="space-y-4">
                <div>
                    <label class="block text-xs font-medium text-slate-600 mb-1">1. 出發地</label>
                    <select id="origin" class="w-full border-slate-300 rounded-lg p-2 text-sm bg-slate-50">
                        <option value="A">A = 香港</option>
                        <option value="B">B = 深圳</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-medium text-slate-600 mb-1">2. 目的地</label>
                    <select id="destination" class="w-full border-slate-300 rounded-lg p-2 text-sm bg-slate-50">
                        <option value="A">A = 中國</option>
                        <option value="B">B = 日本</option>
                        <option value="C">C = 韓國</option>
                        <option value="D">D = 東南亞</option>
                        <option value="E">E = 歐洲</option>
                        <option value="F">F = 其他</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-medium text-slate-600 mb-1">3. 天數</label>
                    <select id="days" class="w-full border-slate-300 rounded-lg p-2 text-sm bg-slate-50">
                        <option value="A">A = 1-2天</option>
                        <option value="B">B = 3-4天</option>
                        <option value="C">C = 5-6天</option>
                        <option value="D">D = 7-8天</option>
                        <option value="E">E = 其他</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-medium text-slate-600 mb-1">4. 交通方式</label>
                    <select id="transport" class="w-full border-slate-300 rounded-lg p-2 text-sm bg-slate-50">
                        <option value="A">A = 飛機</option>
                        <option value="B">B = 遊輪</option>
                        <option value="C">C = 高鐵</option>
                        <option value="D">D = 巴士</option>
                        <option value="E">E = 其他</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-medium text-slate-600 mb-1">5. 出發月份 (2026年)</label>
                    <select id="month" class="w-full border-slate-300 rounded-lg p-2 text-sm bg-slate-50">
                        <script>
                            for(let i=1; i<=12; i++) {
                                document.write(`<option value="${i}" ${i===9?'selected':''}>${i} 月</option>`);
                            }
                        </script>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-medium text-slate-600 mb-2">6. 核心偏好 (可多選)</label>
                    <div class="space-y-1.5 text-xs text-slate-700">
                        <label class="flex items-center gap-2"><input type="checkbox" name="pref" value="A" class="rounded text-indigo-600"> A = 依價格低至高排序</label>
                        <label class="flex items-center gap-2"><input type="checkbox" name="pref" value="B" class="rounded text-indigo-600"> B = 只留五星/純玩無購物</label>
                        <label class="flex items-center gap-2"><input type="checkbox" name="pref" value="C" class="rounded text-indigo-600"> C = 美食優先</label>
                        <label class="flex items-center gap-2"><input type="checkbox" name="pref" value="D" class="rounded text-indigo-600"> D = 長輩低強度行程</label>
                        <label class="flex items-center gap-2"><input type="checkbox" name="pref" value="E" class="rounded text-indigo-600"> E = 當季秘境推薦</label>
                        <label class="flex items-center gap-2"><input type="checkbox" name="pref" value="F" class="rounded text-indigo-600" checked> F = 無特殊偏好（綜合推薦）</label>
                    </div>
                </div>

                <button type="button" onclick="renderResults()" class="w-full bg-indigo-600 text-white font-bold py-3 rounded-xl shadow-lg hover:bg-indigo-700 transition flex items-center justify-center gap-2">
                    <i class="fa-solid fa-magnifying-glass"></i> 開始智能搜尋
                </button>
            </form>
        </section>

        <!-- 右側：搜尋結果 (第二步 & 第三步) -->
        <section class="md:col-span-2 space-y-6">
            
            <!-- 偏好提示標題 -->
            <div id="preferenceTag" class="bg-indigo-100 border-l-4 border-indigo-600 p-4 rounded-r-xl text-indigo-900 font-semibold text-sm">
                請在左側選擇篩選條件並點擊「開始智能搜尋」。
            </div>

            <!-- 行程清單卡片 -->
            <div id="resultsList" class="space-y-4">
                <!-- 預設預覽卡片或搜尋結果會渲染在這裡 -->
            </div>

            <!-- 第三步：用戶指令快捷操作面板 -->
            <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm space-y-3">
                <h3 class="text-sm font-bold text-slate-800 flex items-center gap-2">
                    <i class="fa-solid fa-terminal text-indigo-600"></i> 第三步：快速指令操作
                </h3>
                <div class="flex flex-wrap gap-2 text-xs">
                    <button onclick="addMoreResults()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium px-3 py-2 rounded-lg border border-slate-300">
                        <i class="fa-solid fa-plus text-indigo-500"></i> more (再看3個團)
                    </button>
                    <button onclick="compareTours()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium px-3 py-2 rounded-lg border border-slate-300">
                        <i class="fa-solid fa-[#5c7cfa] fa-code-compare"></i> COMPARE 1,2 (深入對比)
                    </button>
                    <button onclick="quickFilter('A')" class="bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium px-3 py-2 rounded-lg border border-slate-300">
                        CHANGE A (改為低至高)
                    </button>
                    <button onclick="quickFilter('BC')" class="bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium px-3 py-2 rounded-lg border border-slate-300">
                        CHANGE BC (改為五星+美食)
                    </button>
                </div>
            </div>

        </section>
    </main>

    <!-- JavaScript 業務邏輯與自動計算引擎 -->
    <script>
        // 模擬數據庫 (包含領華旅行社限制條件)
        const mockDatabase = [
            {
                id: 1,
                agency: "領華旅行社",
                title: "惠州雙月灣度假純玩2天",
                code: "HZ-02B",
                dest: "廣東惠州",
                days: "2天",
                currency: "HK$",
                price: 399,
                guideFee: 140,
                score: 8.8,
                details: { price: 8.8, hotel: 9.0, spot: 8.5, food: 8.5, pure: 10 },
                hotel: "保證入住惠州雙月灣一線海景高級度假酒店",
                spots: "雙月灣觀景台、西班牙風情小鎮、礁石酒吧打卡",
                food: "【豪品海鮮海珍宴】、【客家古法鹽焗雞風味宴】",
                url: "http://www.lingwah.com/tours/HZ-02B",
                destinationType: "A",
                isLingWah: true
            },
            {
                id: 2,
                agency: "大航假期",
                title: "中山、順德美食娛樂純玩2天",
                code: "ZSD-02",
                dest: "中山/順德",
                days: "2天",
                currency: "HK$",
                price: 339,
                guideFee: 140,
                score: 9.2,
                details: { price: 9.5, hotel: 8.5, spot: 8.8, food: 10, pure: 10 },
                hotel: "入住中山全新開業四星標準商務酒店",
                spots: "順德逢簡水鄉、中山孫中山故居、咀香園杏仁餅體驗",
                food: "任食【招牌石岐乳鴿宴】、【順德拆魚羹+均安蒸豬宴】",
                url: "https://www.bigline.hk",
                destinationType: "A",
                isLingWah: false
            },
            {
                id: 3,
                agency: "永安旅遊",
                title: "深圳、東莞松山湖輕鬆度假2天",
                code: "SZE02M",
                dest: "深圳/東莞",
                days: "2天",
                currency: "HK$",
                price: 459,
                guideFee: 140,
                score: 8.9,
                details: { price: 8.5, hotel: 9.5, spot: 8.5, food: 9.0, pure: 10 },
                hotel: "保證入住東莞五星級帝豪花園酒店",
                spots: "東莞松山湖歐洲小鎮、華為小鎮、深圳甘坑客家小鎮",
                food: "酒店【中西式海鮮自助晚餐】、【東莞荔枝柴燒鵝宴】",
                url: "https://www.wingontravel.com",
                destinationType: "A",
                isLingWah: false
            }
        ];

        // 快捷編碼解析器
        function applyQuickCode() {
            const code = document.getElementById('quickCode').value.trim().toUpperCase();
            if(!code) return;

            const [baseCode, prefCode] = code.split('+');
            if(baseCode && baseCode.length >= 5) {
                const mapOrigin = { 'A': 'A', 'B': 'B' };
                const mapDest = { 'A': 'A', 'B': 'B', 'C': 'C', 'D': 'D', 'E': 'E', 'F': 'F' };
                const mapDays = { 'A': 'A', 'B': 'B', 'C': 'C', 'D': 'D', 'E': 'E' };
                const mapTrans = { 'A': 'A', 'B': 'B', 'C': 'C', 'D': 'D', 'E': 'E' };

                if(mapOrigin[baseCode[0]]) document.getElementById('origin').value = baseCode[0];
                if(mapDest[baseCode[1]]) document.getElementById('destination').value = baseCode[1];
                if(mapDays[baseCode[2]]) document.getElementById('days').value = baseCode[2];
                if(mapTrans[baseCode[3]]) document.getElementById('transport').value = baseCode[3];
                
                const monthNum = parseInt(baseCode.substring(4));
                if(monthNum >= 1 && monthNum <= 12) document.getElementById('month').value = monthNum;
            }

            // 勾選偏好
            if(prefCode) {
                const checkboxes = document.querySelectorAll('input[name="pref"]');
                checkboxes.forEach(cb => {
                    cb.checked = prefCode.includes(cb.value);
                });
            }
            renderResults();
        }

        // 渲染搜尋結果 (第二步)
        function renderResults() {
            const checkboxes = document.querySelectorAll('input[name="pref"]:checked');
            const selectedPrefs = Array.from(checkboxes).map(cb => cb.parentNode.textContent.trim());
            
            // 更新提示列
            const tagContainer = document.getElementById('preferenceTag');
            tagContainer.innerHTML = `【已根據您的多重偏好設定：${selectedPrefs.join(' + ') || '綜合推薦'} 進行精準複合篩選】`;

            // 生成卡片
            const resultsList = document.getElementById('resultsList');
            resultsList.innerHTML = '';

            mockDatabase.forEach((tour, index) => {
                const totalPrice = tour.price + tour.guideFee;
                const cardHtml = `
                    <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm hover:shadow-md transition">
                        <div class="flex justify-between items-start mb-2">
                            <div>
                                <span class="bg-indigo-100 text-indigo-700 text-xs font-bold px-2.5 py-1 rounded-md mb-2 inline-block">[${tour.agency}]</span>
                                <h3 class="font-bold text-slate-900 text-base">${index + 1}. ${tour.title}（${tour.code}）</h3>
                            </div>
                            <div class="text-right">
                                <div class="text-lg font-black text-rose-600">${tour.currency} ${totalPrice.toLocaleString()}</div>
                                <div class="text-[11px] text-slate-400">已含導遊費 ${tour.currency} ${tour.guideFee}</div>
                            </div>
                        </div>

                        <!-- 評分列 -->
                        <div class="bg-slate-50 p-3 rounded-xl my-3 text-xs flex flex-wrap justify-between items-center border border-slate-100">
                            <span class="font-bold text-indigo-600 text-sm">★ 性價比總分：${tour.score} 分</span>
                            <span class="text-slate-500">價格${tour.details.price}/10 | 酒店${tour.details.hotel}/10 | 景點${tour.details.spot}/10 | 餐飲${tour.details.food}/10 | 純玩${tour.details.pure}/10</span>
                        </div>

                        <!-- 簡介 -->
                        <div class="text-xs text-slate-600 space-y-1 mt-2">
                            <p><strong>酒店：</strong>${tour.hotel}</p>
                            <p><strong>景點：</strong>${tour.spots}</p>
                            <p><strong>美食：</strong>${tour.food}</p>
                        </div>

                        <!-- 官方連結 -->
                        <div class="mt-4 border-t pt-3 flex justify-between items-center text-xs">
                            <a href="${tour.url}" target="_blank" class="text-indigo-600 font-semibold hover:underline flex items-center gap-1">
                                <i class="fa-solid fa-arrow-up-right-from-square"></i> 官方行程連結
                            </a>
                        </div>
                    </div>
                `;
                resultsList.innerHTML += cardHtml;
            });
        }

        // 指令：新增更多團
        function addMoreResults() {
            alert("正在即時爬取更多數據... (more 指令可繼續載入額外 3 個最新團)");
        }

        // 指令：深入對比
        function compareTours() {
            alert("COMPARE 1,2 對比分析：\n\n1. 領華海景度假團：勝在海景客房與度假氛圍，適合放鬆。\n2. 大航順德美食團：勝在美食豐富（乳鴿+拆魚羹）與價格便宜，CP值更高！");
        }

        // 指令：快速切換偏好
        function quickFilter(code) {
            document.getElementById('quickCode').value = "AAAD9+" + code;
            applyQuickCode();
        }

        // 頁面初次載入時自動執行一次渲染
        window.onload = renderResults;
    </script>
</body>
</html>
